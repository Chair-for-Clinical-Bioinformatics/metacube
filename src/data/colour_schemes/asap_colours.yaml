# ── ASAP / CRN colour scheme ──────────────────────────────────────────────────
# The ASAP brand look (green · teal · blue, with purple as the organoid accent).
# Selected by a dataset config with
#   colour_scheme: asap
#
# Two modes — `dark` is the ASAP presentation theme (deep green→teal→navy stage,
# glowing green cells, purple accent); `light` is the ASAP brand on a soft tinted
# white page. The runtime toggle switches between them.
#
# Edit values here, then `pixi run dev` / `pixi run export-template` recompile the
# bundle (inlined at build time). Every key is required in both modes.

light:
  background:          "linear-gradient(135deg, #f4eefc 0%, #eaf3fb 50%, #ecf7ee 100%)"
  panel_bg:            "rgba(255, 255, 255, 0.92)"
  panel_bg_solid:      "rgba(255, 255, 255, 0.98)"
  panel_border:        "#d8cfe4"
  card_bg:             "#f4f1f7"
  card_bg_active:      "rgba(140, 78, 159, 0.18)"
  backdrop:            "rgba(40, 20, 50, 0.35)"

  text:                "#2a1a32"
  text_body:           "#4b3a55"
  # Lighter muted/dim so resting & dimmed labels recede on the light page,
  # leaving the bright axis colours as the clear highlight.
  text_muted:          "#897e93"
  text_dim:            "#b3aabe"

  accent:              "#8c4e9f"
  accent_strong:       "#6f3d80"
  accent_fill:         "#8c4e9f"
  accent_soft_bg:      "rgba(140, 78, 159, 0.15)"
  accent_soft_border:  "rgba(140, 78, 159, 0.50)"

  cell_default:        "#239c6c"
  cell_accent:         "#8c4e9f"
  edge:                "#c9bcd6"
  edge_hover:          "#2a1a32"
  edge_selected:       "#8c4e9f"
  # Selection contrast: unselected cells lose their fill and keep only a
  # grey (light) / white (dark) outline; selected cells keep colour + strong outline.
  cell_dim:            "#efeaf3"
  edge_dim:            "#6b7280"
  edge_focus:          "#2a1a32"
  wire:                "#1B75BC"
  grid:                "#cfe3ef"

  axis:                { x: "#5C2D91", y: "#1B75BC", z: "#2E9E3F" }
  axis_title:          "#5C2D91"
  axis_outline:        "#ffffff"

  categorical:
    - "#5C2D91"
    - "#1B75BC"
    - "#2E9E3F"
    - "#8c4e9f"
    - "#00838F"
    - "#0c8dc3"
    - "#239c6c"
    - "#745ba6"
    - "#b07cc0"
    - "#f59e0b"
    - "#e0529c"
    - "#84cc16"

  size_scale:          { low: "#e7f4ee", mid: "#239c6c", high: "#6f3d80" }

dark:
  background:          "linear-gradient(150deg, #0b3f2d 0%, #064a57 48%, #081d39 100%)"
  panel_bg:            "rgba(9, 24, 28, 0.88)"
  panel_bg_solid:      "rgba(11, 26, 31, 0.96)"
  panel_border:        "rgba(255, 255, 255, 0.18)"
  card_bg:             "rgba(255, 255, 255, 0.08)"
  card_bg_active:      "rgba(150, 92, 170, 0.34)"
  backdrop:            "rgba(4, 12, 16, 0.62)"

  # Wider spread so dimmed/resting labels (text_muted/text_dim) read clearly below
  # the bright primary text on the dark stage — keeps selection highlight visible.
  text:                "#f4faf8"
  text_body:           "#d2e4de"
  text_muted:          "#84a59c"
  text_dim:            "#5f7a72"

  accent:              "#b07cc0"
  accent_strong:       "#c79bd6"
  accent_fill:         "#8c4e9f"
  accent_soft_bg:      "rgba(140, 78, 159, 0.22)"
  accent_soft_border:  "rgba(176, 124, 192, 0.55)"

  cell_default:        "#2bc88c"
  cell_accent:         "#a25fb8"
  edge:                "#4f7f78"
  edge_hover:          "#ffffff"
  edge_selected:       "#c79bd6"
  # Selection contrast: unselected cells lose their fill and keep only a
  # grey (light) / white (dark) outline; selected cells keep colour + strong outline.
  cell_dim:            "#1c3a3f"
  edge_dim:            "#ffffff"
  edge_focus:          "#ffffff"
  wire:                "#3fb6d9"
  grid:                "#7fdcff"

  axis:                { x: "#3ad29a", y: "#c08fd0", z: "#4fc6e8" }
  axis_title:          "#ffd27a"
  axis_outline:        "#05201a"

  categorical:
    - "#2bc88c"
    - "#b07cc0"
    - "#1793ad"
    - "#745ba6"
    - "#5cbf95"
    - "#d3a6e0"
    - "#0c8dc3"
    - "#239c6c"
    - "#8c4e9f"
    - "#36c6e8"
    - "#f59e0b"
    - "#ef6aa9"
    - "#9ad84a"
    - "#22d3d3"
    - "#fb7185"
    - "#8b9bf6"
    - "#facc4d"
    - "#fb9d4b"
    - "#2dd4bf"
    - "#c084fc"

  size_scale:          { low: "#e7f4ee", mid: "#239c6c", high: "#6f3d80" }
